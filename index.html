<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAPOS — Контент-план</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0b;--surface:#161510;--surface2:#1d1c17;--surface3:#232219;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --gold:#5b8def;--gold2:#84a8ff;--text:#f0ece3;--muted:#7a7569;--muted2:#a09890;
  --s-idea:#5a5650;--s-wip:#c98a2a;--s-ready:#3d9e75;--s-pub:#8b7fd4;
  --danger:#e05050;
  --calendar-filter:invert(0.5);
  --shadow:0 4px 16px rgba(0,0,0,0.35);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#ffffff;--surface:#ffffff;--surface2:#f4f5f7;--surface3:#e9eaed;
    --border:rgba(0,0,0,0.06);--border2:rgba(0,0,0,0.12);
    --gold:#2563eb;--gold2:#1d4ed8;--text:#111827;--muted:#9ca3af;--muted2:#6b7280;
    --s-idea:#9ca3af;--s-wip:#d97706;--s-ready:#16a34a;--s-pub:#7c3aed;
    --danger:#dc2626;
    --calendar-filter:none;
    --shadow:0 4px 16px rgba(0,0,0,0.06);
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:400;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem 0.6rem;gap:10px;}
.page-title{font-family:'Inter',sans-serif;font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.topbar-right{display:flex;gap:6px;align-items:center;}
.icon-btn{font-size:12px;padding:5px 13px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.icon-btn:disabled{opacity:0.3;cursor:default;}
#sync-status{font-size:11px;color:var(--muted);min-width:100px;text-align:right;}

/* SEARCH */
.search-bar{padding:0 1.5rem;display:none;}
.search-bar.visible{display:block;}
.search-wrap{position:relative;display:flex;align-items:center;}
.search-wrap svg{position:absolute;left:12px;width:16px;height:16px;stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round;pointer-events:none;}
.search-inp{width:100%;background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:9px 12px 9px 36px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.15s;}
.search-inp:focus{border-color:var(--gold);}
.search-inp::placeholder{color:var(--muted);}
.search-clear{position:absolute;right:8px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 8px;border-radius:4px;display:none;}
.search-clear.visible{display:block;}
.search-clear:hover{color:var(--text);}

/* FILTER BUTTON & MODAL */
.filter-row{display:flex;align-items:center;justify-content:space-between;padding:0.4rem 1.5rem 0.7rem;gap:8px;}
.filter-row.visible{display:flex;}
.filter-row.hidden{display:none;}
.filter-btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;
  padding:7px 14px;border-radius:20px;border:0.5px solid var(--border2);
  background:var(--surface);color:var(--text);cursor:pointer;
  font-family:'Inter',sans-serif;transition:all 0.15s;
}
.filter-btn:hover{border-color:var(--gold);color:var(--gold);}
.filter-btn.has-active{background:var(--gold);color:#fff;border-color:var(--gold);}
.filter-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;}
.filter-badge{background:rgba(255,255,255,0.25);font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;}
.active-filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.active-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:14px;background:var(--surface2);color:var(--muted2);}
.active-chip .x{cursor:pointer;color:var(--muted);font-size:13px;line-height:1;}
.active-chip .x:hover{color:var(--danger);}

/* Filter modal */
.fmodal{background:var(--surface);border:0.5px solid var(--border2);border-radius:14px;padding:1.4rem 1.4rem 1rem;width:440px;max-width:93vw;max-height:85vh;overflow-y:auto;}
.fmodal h3{font-family:'Inter',sans-serif;font-size:18px;color:var(--text);margin-bottom:1.1rem;font-weight:600;letter-spacing:-0.01em;}
.fgroup{margin-bottom:1.2rem;}
.fgroup-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.fchips{display:flex;flex-wrap:wrap;gap:6px;}
.fchip{font-size:12px;padding:5px 12px;border-radius:18px;border:0.5px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.12s;}
.fchip:hover{border-color:var(--gold);color:var(--gold);}
.fchip.on{background:var(--gold);color:#fff;border-color:var(--gold);}
.fmodal-btns{display:flex;justify-content:space-between;gap:8px;margin-top:0.5rem;padding-top:1rem;border-top:0.5px solid var(--border);}

/* PAGE CONTAINER */
.page{display:none;padding:0 1.5rem 2rem;}
.page.visible{display:block;}

/* LIST PAGE */
.section{margin-top:1rem;}
.section-head{display:flex;align-items:center;gap:9px;padding:0.6rem 0.4rem 0.4rem;cursor:pointer;user-select:none;}
.section-title{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text);letter-spacing:0.02em;}
.section-title.overdue{color:var(--danger);}
.section-title.today{color:var(--gold2);}
.section-title.completed{color:var(--muted);}
.section-count{font-size:11px;color:var(--muted);}
.section-toggle{margin-left:auto;color:var(--muted);font-size:14px;transition:transform 0.15s;}
.section.collapsed .section-toggle{transform:rotate(-90deg);}
.section.collapsed .post-list{display:none;}
.post-list{display:flex;flex-direction:column;background:var(--surface);border-radius:10px;border:0.5px solid var(--border);overflow:hidden;}
.post-row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background 0.1s;}
.post-row:last-child{border-bottom:none;}
.post-row:hover{background:var(--surface2);}

/* Status dot */
.status-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1.5px solid transparent;background-clip:padding-box;transition:transform 0.12s;}
.status-dot:hover{transform:scale(1.15);}

/* Post body */
.post-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.post-topic{font-size:14px;color:var(--text);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post-sub{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.post-cat-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:1px 7px;border-radius:10px;}
.post-cat-tag .cdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.post-fmt{font-size:10px;color:var(--muted);}

/* Date */
.post-date{font-size:11px;color:var(--muted2);white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.3;}
.post-date.overdue{color:var(--danger);}
.post-date.today{color:var(--gold2);font-weight:500;}

/* Empty */
.empty-section{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:12px;}

/* DASHBOARD */
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:1rem;}
.dash-card{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:1.1rem 1.2rem;}
.dash-val{font-family:'Inter',sans-serif;font-size:32px;color:var(--gold);line-height:1;margin-bottom:5px;font-weight:600;letter-spacing:-0.02em;}
.dash-label{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}

.dash-section{margin-top:1.5rem;}
.dash-section h3{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);font-weight:600;margin-bottom:0.7rem;letter-spacing:-0.01em;}
.breakdown{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;overflow:hidden;}
.bd-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--border);}
.bd-row:last-child{border:none;}
.bd-label{flex:1;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);}
.bd-label .ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.bd-bar{flex:2;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.bd-fill{height:100%;border-radius:3px;}
.bd-count{font-size:12px;color:var(--muted);min-width:25px;text-align:right;}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 0;}
.cal-title{font-family:'Inter',sans-serif;font-size:17px;color:var(--text);font-weight:600;letter-spacing:-0.01em;}
.cal-nav-btns{display:flex;gap:6px;}
.nav-btn{background:transparent;border:0.5px solid var(--border2);color:var(--muted2);border-radius:20px;padding:4px 14px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cal-scroll::-webkit-scrollbar{height:6px;}
.cal-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:1px;background:var(--border);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;min-width:780px;}
.cal-dow{background:var(--surface2);text-align:center;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:8px 4px;}
.cal-day{background:var(--surface);min-height:95px;padding:6px 5px 4px;position:relative;}
.cal-day.other-m{background:var(--bg);opacity:0.45;}
.cal-day.today-cell{background:var(--surface3);}
.cal-day.today-cell .cal-day-num{color:var(--gold);font-weight:500;}
.cal-day.drag-over{background:rgba(201,168,76,0.1);outline:1px dashed var(--gold);}
.cal-day-num{font-size:11px;color:var(--muted);margin-bottom:3px;}
.cal-post{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none;}
.cal-post:hover{opacity:0.75;}
.cal-post.dragging-cal{opacity:0.25;}
.cal-add{position:absolute;bottom:3px;right:4px;background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;opacity:0;transition:opacity 0.12s;}
.cal-day:hover .cal-add{opacity:1;}
.cal-add:hover{color:var(--gold);}

/* SETTINGS PAGE */
.settings-section{margin-top:1.5rem;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:1.2rem 1.3rem;}
.settings-title{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);font-weight:600;margin-bottom:0.9rem;letter-spacing:-0.01em;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:20px;border:0.5px solid var(--border2);color:var(--muted2);}
.tag-item .tsw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tag-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0;}
.tag-del:hover{color:var(--danger);}
.tag-add{display:flex;gap:6px;align-items:center;}
.tag-add input[type=text]{flex:1;background:var(--surface2);border:0.5px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:12px;padding:6px 10px;outline:none;}
.tag-add input[type=text]:focus{border-color:var(--gold);}
.tag-add input[type=color]{flex:0 0 32px;height:32px;padding:2px;cursor:pointer;border-radius:4px;border:0.5px solid var(--border2);background:transparent;}
.tag-add button{font-family:'Inter',sans-serif;font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;white-space:nowrap;}
.tag-add button:hover{border-color:var(--gold);color:var(--gold);}
.settings-action{display:flex;gap:8px;margin-top:1rem;}

/* BOTTOM NAV - floating pill */
.bottom-nav{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:0.5px solid var(--border);
  display:flex;align-items:center;height:60px;z-index:50;
  border-radius:32px;padding:6px 8px;gap:2px;
  box-shadow:0 8px 30px rgba(0,0,0,0.15),0 2px 8px rgba(0,0,0,0.08);
}
@media(prefers-color-scheme:dark){.bottom-nav{box-shadow:0 8px 30px rgba(0,0,0,0.5),0 2px 8px rgba(0,0,0,0.3);}}
.nav-item{
  background:transparent;border:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--muted);
  cursor:pointer;font-family:'Inter',sans-serif;font-size:9.5px;
  padding:5px 14px;border-radius:24px;transition:all 0.15s;min-width:62px;
}
.nav-item:hover{color:var(--gold);}
.nav-item.active{color:var(--gold);background:var(--surface2);}
.nav-item .nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.nav-item.active svg{stroke-width:2.1;}
.nav-label{font-weight:400;letter-spacing:0.01em;}
.nav-item.active .nav-label{font-weight:500;}

.nav-add{
  width:48px;height:48px;border-radius:50%;background:var(--gold);color:#fff;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:300;line-height:0;margin:0 4px;
  box-shadow:0 4px 12px rgba(37,99,235,0.45);transition:all 0.12s;flex-shrink:0;
}
.nav-add:hover{background:var(--gold2);transform:scale(1.05);}
@media(prefers-color-scheme:dark){.nav-add{box-shadow:0 4px 12px rgba(91,141,239,0.5);}}

/* STATUS POPUP */
.status-popup{position:fixed;background:var(--surface);border:0.5px solid var(--border2);border-radius:8px;z-index:300;min-width:160px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,0.4);}
.status-popup-item{padding:7px 11px;font-size:13px;border-radius:5px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px;}
.status-popup-item:hover{background:var(--surface2);}
.status-popup-item .sp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal-box{background:var(--surface);border:0.5px solid var(--border2);border-radius:12px;padding:1.6rem 1.5rem;width:420px;max-width:93vw;max-height:90vh;overflow-y:auto;}
.modal-box h3{font-family:'Inter',sans-serif;font-size:18px;color:var(--text);margin-bottom:1.1rem;font-weight:600;letter-spacing:-0.01em;}
.form-row{margin-bottom:0.8rem;}
.form-lbl{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block;}
.form-inp,.form-sel{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:300;padding:7px 10px;outline:none;}
.form-inp:focus,.form-sel:focus{border-color:var(--gold);}
.form-sel option{background:var(--surface2);color:var(--text);}
.form-inp[type=date]::-webkit-calendar-picker-indicator{filter:var(--calendar-filter);cursor:pointer;}
.modal-btns{display:flex;gap:8px;margin-top:1.1rem;justify-content:flex-end;}
.btn-cancel{font-family:'Inter',sans-serif;font-size:13px;padding:6px 16px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;}
.btn-ok{font-family:'Inter',sans-serif;font-size:13px;padding:6px 18px;border-radius:20px;border:none;background:var(--gold);color:var(--bg);font-weight:500;cursor:pointer;}
.btn-ok:hover{background:var(--gold2);}
.btn-danger{font-family:'Inter',sans-serif;font-size:13px;padding:6px 16px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--danger);cursor:pointer;}
.btn-danger:hover{border-color:var(--danger);}

/* DRAWER */
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;}
.drawer-bg.open{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:500px;max-width:96vw;background:var(--surface);border-left:0.5px solid var(--border2);z-index:201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.22s cubic-bezier(0.4,0,0.2,1);}
.drawer.open{transform:translateX(0);}
.dh{padding:1.2rem 1.4rem 0.9rem;border-bottom:0.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-shrink:0;}
.dh-title{font-family:'Inter',sans-serif;font-size:16px;color:var(--text);line-height:1.4;font-weight:600;letter-spacing:-0.01em;}
.dh-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.dh-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;}
.dh-icon{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:3px 6px;border-radius:5px;transition:color 0.12s;}
.dh-icon:hover{color:var(--text);}
.dh-icon.danger:hover{color:var(--danger);}
.db{flex:1;overflow-y:auto;padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:1.2rem;}
.d-section-lbl{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.d-textarea{width:100%;min-height:200px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:300;line-height:1.7;padding:10px 12px;resize:vertical;outline:none;}
.d-textarea:focus{border-color:var(--gold);}
.drop-zone{border:0.5px dashed var(--border2);border-radius:8px;padding:0.9rem;text-align:center;cursor:pointer;transition:all 0.15s;user-select:none;}
.drop-zone:hover,.drop-zone.over{border-color:var(--gold);background:rgba(201,168,76,0.04);}
.drop-zone p{font-size:12px;color:var(--muted2);}
.drop-zone p span{color:var(--gold);}
.drop-zone small{font-size:10px;color:var(--muted);}
.file-list{display:flex;flex-direction:column;gap:5px;margin-top:7px;}
.file-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:0.5px solid var(--border);border-radius:6px;padding:6px 8px;}
.f-thumb{width:30px;height:30px;border-radius:4px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;overflow:hidden;}
.f-thumb img{width:100%;height:100%;object-fit:cover;border-radius:4px;}
.f-info{flex:1;min-width:0;}
.f-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-size{font-size:10px;color:var(--muted);margin-top:1px;}
.f-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;}
.f-dl,.f-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1;}
.f-dl:hover{color:var(--gold);}
.f-del:hover{color:var(--danger);}
.df{padding:0.8rem 1.4rem;border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-shrink:0;}
.d-hint{font-size:11px;color:var(--s-ready);}
.d-save{font-family:'Inter',sans-serif;font-size:13px;padding:6px 18px;border-radius:20px;border:none;background:var(--gold);color:var(--bg);font-weight:500;cursor:pointer;}
.d-save:hover{background:var(--gold2);}

@media(max-width:700px){
  .topbar{padding:0.9rem 1rem 0.5rem;}
  .search-bar{padding:0 1rem;}
  .filter-row{padding:0.4rem 1rem 0.7rem;}
  .page{padding:0 1rem 1.5rem;}
  .page-title{font-size:24px;}
  .icon-btn{font-size:12px;padding:5px 11px;}

<script>
const MONTHS_RU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WEEKDAYS=['вс','пн','вт','ср','чт','пт','сб'];

const DEFAULT_CATS=[
  {id:'lux',  label:'Люкс & история',color:'#8b7fd4'},
  {id:'unbox',label:'Распаковка',    color:'#3d9e75'},
  {id:'proc', label:'Процесс',       color:'#c98a2a'},
  {id:'edu',  label:'Ликбез',        color:'#c45c2a'},
];
const DEFAULT_STATUSES=[
  {id:'idea', label:'Идея',         color:'#5a5650'},
  {id:'wip',  label:'В работе',     color:'#c98a2a'},
  {id:'ready',label:'Готово',       color:'#3d9e75'},
  {id:'pub',  label:'Опубликовано', color:'#8b7fd4'},
];
const SEED=[
  {cat:'lux',  date:'2025-05-01',topic:'Birkin обогнала золото и акции',                    fmt:'Рилс',    status:'ready',text:'',files:[]},
  {cat:'edu',  date:'2025-05-07',topic:'Buttero vs Pueblo: в чём разница',                  fmt:'Карусель',status:'idea', text:'',files:[]},
];

let posts=[], nextId=1, cats=[], statuses=[], currentPage='list', searchQuery='';
let filters={cats:[],fmts:[],statuses:[]};
const FORMATS=['Рилс','Карусель','Фото','Сторис'];
let calYear, calMonth;
let drawerId=null, drawerFiles=[];
let calDragId=null;

const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();

/* ===== SUPABASE ===== */
const SB_URL='https://jluvsdgozaefknzqjnxp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdXZzZGdvemFlZmtuenFqbnhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTA2NTQsImV4cCI6MjA5MjU4NjY1NH0.9RN_z_DS3WHR7urn7nBViD-woOiBzpqpxL1X3iDID6M';
const SB_H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'};

async function sbFetch(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/plan_data?key=eq.main',{headers:SB_H});
    if(!r.ok)return null;
    const rows=await r.json();
    return rows&&rows.length>0?rows[0].value:null;
  }catch(e){return null;}
}
async function sbSave(data){
  try{
    const lean={...data,posts:data.posts.map(p=>({...p,files:(p.files||[]).map(f=>({name:f.name,size:f.size,type:f.type}))}))};
    const r=await fetch(SB_URL+'/rest/v1/plan_data',{method:'POST',headers:SB_H,body:JSON.stringify({key:'main',value:lean,updated_at:new Date().toISOString()})});
    return r.ok;
  }catch(e){return false;}
}
function keepAlive(){setInterval(()=>fetch(SB_URL+'/rest/v1/plan_data?key=eq.main&select=key',{headers:SB_H}).catch(()=>{}),240000);}
function mergeFilesFromLocal(remotePosts){
  const local=getLocalData();
  if(!local||!local.posts)return remotePosts;
  return remotePosts.map(rp=>{
    const lp=local.posts.find(x=>x.id===rp.id);
    if(!lp||!lp.files||!lp.files.length)return rp;
    const merged=(rp.files||[]).map(rf=>{
      const lf=lp.files.find(f=>f.name===rf.name&&f.size===rf.size);
      return lf&&(lf.data||lf.preview)?{...rf,data:lf.data||lf.preview}:rf;
    });
    return {...rp,files:merged};
  });
}

/* ===== STORAGE ===== */
let lastLocalSaveAt=0,saveTimer=null,pollTimer=null;
function setSyncStatus(text,color){const el=document.getElementById('sync-status');if(el){el.textContent=text;el.style.color=color||'var(--muted)';}}
function getLocalData(){try{const r=localStorage.getItem('papos_v5');return r?JSON.parse(r):null;}catch(e){return null;}}
function setLocalData(d){try{localStorage.setItem('papos_v5',JSON.stringify(d));}catch(e){}}

async function load(){
  const local=getLocalData();
  if(local&&local.posts){
    applyData(local);lastLocalSaveAt=local.savedAt||0;
    render();renderCal();
  } else {
    posts=SEED.map((p,i)=>({...p,id:i+1}));
    nextId=SEED.length+1;
    cats=JSON.parse(JSON.stringify(DEFAULT_CATS));
    statuses=JSON.parse(JSON.stringify(DEFAULT_STATUSES));
    render();renderCal();
  }
  setSyncStatus('⟳','var(--muted)');
  const remote=await sbFetch();
  if(remote&&remote.posts){
    const rsa=remote.savedAt||0;
    // ONLY apply remote if it is strictly newer than local
    if(rsa>lastLocalSaveAt){
      remote.posts=mergeFilesFromLocal(remote.posts);
      applyData(remote);lastLocalSaveAt=rsa;setLocalData(remote);
      render();renderCal();
      setSyncStatus('↓ обновлено','var(--s-ready)');
    } else {
      setSyncStatus('✓','var(--s-ready)');
    }
  } else setSyncStatus('⚠ офлайн','var(--s-wip)');
  setTimeout(()=>setSyncStatus(''),2000);
}
function applyData(d){
  posts=d.posts||[];nextId=d.nextId||100;
  cats=d.cats&&d.cats.length?d.cats:JSON.parse(JSON.stringify(DEFAULT_CATS));
  statuses=d.statuses&&d.statuses.length?d.statuses:JSON.parse(JSON.stringify(DEFAULT_STATUSES));
}
function save(){
  const data={posts,nextId,cats,statuses,savedAt:Date.now()};
  setLocalData(data);
  lastLocalSaveAt=data.savedAt; // mark local as newest immediately
  clearTimeout(saveTimer);
  setSyncStatus('●','var(--s-wip)');
  saveTimer=setTimeout(async()=>{
    setSyncStatus('⟳','var(--muted)');
    const ok=await sbSave(data);
    if(ok){setSyncStatus('✓','var(--s-ready)');setTimeout(()=>setSyncStatus(''),1500);}
    else {
      setSyncStatus('⚠ не сохранено','var(--danger)');
      // retry once after 3s
      setTimeout(async()=>{
        const ok2=await sbSave(data);
        setSyncStatus(ok2?'✓':'⚠ ошибка',ok2?'var(--s-ready)':'var(--danger)');
        if(ok2)setTimeout(()=>setSyncStatus(''),1500);
      },3000);
    }
  },1200);
  updateUndoRedoBtns();
}
function startPolling(){
  pollTimer=setInterval(async()=>{
    if(saveTimer)return;
    const remote=await sbFetch();
    if(!remote||!remote.posts)return;
    const rsa=remote.savedAt||0;
    // only update if remote is strictly newer
    if(rsa>lastLocalSaveAt){
      remote.posts=mergeFilesFromLocal(remote.posts);
      applyData(remote);lastLocalSaveAt=rsa;setLocalData(remote);
      render();renderCal();
      setSyncStatus('↓','var(--s-ready)');setTimeout(()=>setSyncStatus(''),1500);
    }
  },30000);
}
async function manualSync(){
  clearTimeout(saveTimer);saveTimer=null;
  setSyncStatus('⟳','var(--muted)');
  const remote=await sbFetch();
  if(!remote){setSyncStatus('⚠','var(--danger)');return;}
  const rsa=remote.savedAt||0;
  const local=getLocalData();
  const lsa=local?.savedAt||0;
  // strictly newer only
  if(rsa>lsa){
    remote.posts=mergeFilesFromLocal(remote.posts);
    applyData(remote);lastLocalSaveAt=rsa;setLocalData(remote);render();renderCal();
    setSyncStatus('✓ получено','var(--s-ready)');
  } else {
    // push local to cloud
    const data={posts,nextId,cats,statuses,savedAt:Date.now()};
    const ok=await sbSave(data);
    if(ok){lastLocalSaveAt=data.savedAt;setLocalData(data);}
    setSyncStatus(ok?'✓ выгружено':'⚠ ошибка',ok?'var(--s-ready)':'var(--danger)');
  }
  setTimeout(()=>setSyncStatus(''),2000);
}
// Force push local data to cloud regardless of timestamps
async function forcePush(){
  clearTimeout(saveTimer);saveTimer=null;
  setSyncStatus('⟳ выгрузка…','var(--muted)');
  const data={posts,nextId,cats,statuses,savedAt:Date.now()};
  setLocalData(data);lastLocalSaveAt=data.savedAt;
  const ok=await sbSave(data);
  setSyncStatus(ok?'✓ выгружено в облако':'⚠ ошибка',ok?'var(--s-ready)':'var(--danger)');
  setTimeout(()=>setSyncStatus(''),2500);
}

/* ===== UNDO/REDO ===== */
let undoStack=[],redoStack=[];
function snapshot(){undoStack.push(JSON.parse(JSON.stringify(posts)));if(undoStack.length>30)undoStack.shift();redoStack=[];updateUndoRedoBtns();}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.parse(JSON.stringify(posts)));posts=undoStack.pop();save();render();if(currentPage==='cal')renderCal();updateUndoRedoBtns();}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.parse(JSON.stringify(posts)));posts=redoStack.pop();save();render();if(currentPage==='cal')renderCal();updateUndoRedoBtns();}
function updateUndoRedoBtns(){const u=document.getElementById('undo-btn');const r=document.getElementById('redo-btn');if(u)u.disabled=undoStack.length===0;if(r)r.disabled=redoStack.length===0;}

/* ===== HELPERS ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function todayISO(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function getCat(id){return cats.find(c=>c.id===id)||{label:id,color:'#888',id};}
function getStatus(id){return statuses.find(s=>s.id===id)||statuses[0]||{label:id,color:'#888',id};}
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

function isCompleted(p){
  // Last status in the statuses array is considered "completed"
  const last=statuses[statuses.length-1];
  return last&&p.status===last.id;
}

function dateInfo(iso){
  // returns: {label, isToday, isOverdue, bucket}
  if(!iso)return {label:'',bucket:'nodate'};
  const today=new Date();today.setHours(0,0,0,0);
  const[y,m,d]=iso.split('-').map(Number);
  const date=new Date(y,m-1,d);
  const diff=Math.round((date-today)/86400000);
  let label='';
  if(diff===0)label='Сегодня';
  else if(diff===1)label='Завтра';
  else if(diff===-1)label='Вчера';
  else if(diff>=-6&&diff<=-2)label=WEEKDAYS[date.getDay()]+', '+d+' '+MONTHS_SHORT[m-1];
  else label=d+' '+MONTHS_SHORT[m-1]+(date.getFullYear()!==today.getFullYear()?' '+date.getFullYear():'');
  let bucket;
  if(diff<0)bucket='overdue';
  else if(diff===0)bucket='today';
  else if(diff===1)bucket='tomorrow';
  else if(diff<=7)bucket='week';
  else bucket='later';
  return {label,bucket,diff};
}

/* ===== PAGE NAVIGATION ===== */
function goPage(p){
  currentPage=p;
  ['list','cal','dash','settings'].forEach(x=>{
    document.getElementById('page-'+x).classList.toggle('visible',x===p);
    document.getElementById('nav-'+x).classList.toggle('active',x===p);
  });
  document.getElementById('filter-row').style.display=(p==='list')?'flex':'none';
  document.getElementById('search-bar').classList.toggle('visible',p==='list');
  // page title
  const titles={list:'Все',cal:'Календарь',dash:'Дашборд',settings:'Настройки'};
  document.getElementById('page-title').textContent=titles[p];
  if(p==='cal')renderCal();
  if(p==='dash')renderDash();
  if(p==='settings')renderSettings();
}

/* ===== FILTERS ===== */
function activeFilterCount(){return filters.cats.length+filters.fmts.length+filters.statuses.length;}
function applyFilters(arr){
  return arr.filter(p=>{
    if(filters.cats.length&&!filters.cats.includes(p.cat))return false;
    if(filters.fmts.length&&!filters.fmts.includes(p.fmt))return false;
    if(filters.statuses.length&&!filters.statuses.includes(p.status))return false;
    return true;
  });
}
function renderFilterButton(){
  const cnt=activeFilterCount();
  const btn=document.getElementById('filter-btn-main');
  const badge=document.getElementById('filter-badge');
  btn.classList.toggle('has-active',cnt>0);
  badge.style.display=cnt>0?'inline-block':'none';
  badge.textContent=cnt;
  // active filter chips below
  const af=document.getElementById('active-filters');
  const chips=[];
  filters.cats.forEach(id=>{const c=getCat(id);chips.push(`<span class="active-chip" style="color:${c.color}"><span style="width:6px;height:6px;border-radius:50%;background:${c.color};display:inline-block;"></span>${esc(c.label)}<span class="x" onclick="toggleFilter('cats','${id}')">×</span></span>`);});
  filters.fmts.forEach(f=>chips.push(`<span class="active-chip">${esc(f)}<span class="x" onclick="toggleFilter('fmts','${f}')">×</span></span>`));
  filters.statuses.forEach(id=>{const s=getStatus(id);chips.push(`<span class="active-chip" style="color:${s.color}"><span style="width:6px;height:6px;border-radius:50%;background:${s.color};display:inline-block;"></span>${esc(s.label)}<span class="x" onclick="toggleFilter('statuses','${id}')">×</span></span>`);});
  af.innerHTML=chips.join('');
}
function toggleFilter(group,id){
  const arr=filters[group];
  const i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1);else arr.push(id);
  render();renderFilterModal();
}
function clearAllFilters(){filters={cats:[],fmts:[],statuses:[]};render();renderFilterModal();}
function openFilterModal(){renderFilterModal();document.getElementById('filter-modal').classList.add('open');}
function closeFilterModal(){document.getElementById('filter-modal').classList.remove('open');}
function renderFilterModal(){
  document.getElementById('ff-cats').innerHTML=cats.map(c=>`<button class="fchip${filters.cats.includes(c.id)?' on':''}" onclick="toggleFilter('cats','${c.id}')"><span style="width:7px;height:7px;border-radius:50%;background:${c.color};display:inline-block;margin-right:5px;vertical-align:middle;"></span>${esc(c.label)}</button>`).join('');
  document.getElementById('ff-fmts').innerHTML=FORMATS.map(f=>`<button class="fchip${filters.fmts.includes(f)?' on':''}" onclick="toggleFilter('fmts','${f}')">${f}</button>`).join('');
  document.getElementById('ff-statuses').innerHTML=statuses.map(s=>`<button class="fchip${filters.statuses.includes(s.id)?' on':''}" onclick="toggleFilter('statuses','${s.id}')"><span style="width:7px;height:7px;border-radius:50%;background:${s.color};display:inline-block;margin-right:5px;vertical-align:middle;"></span>${esc(s.label)}</button>`).join('');
}
document.getElementById('filter-modal').addEventListener('click',function(e){if(e.target===this)closeFilterModal();});

/* ===== SEARCH ===== */
function onSearchInput(v){
  searchQuery=v.trim().toLowerCase();
  document.getElementById('search-clear').classList.toggle('visible',searchQuery.length>0);
  render();
}
function clearSearch(){
  document.getElementById('search-inp').value='';
  searchQuery='';
  document.getElementById('search-clear').classList.remove('visible');
  render();
}

/* ===== RENDER LIST (grouped) ===== */
function render(){
  renderFilterButton();
  let visible=applyFilters(posts);
  if(searchQuery)visible=visible.filter(p=>(p.topic||'').toLowerCase().includes(searchQuery)||(p.text||'').toLowerCase().includes(searchQuery));
  // group buckets
  const buckets={overdue:[],today:[],tomorrow:[],week:[],later:[],nodate:[],completed:[]};
  visible.forEach(p=>{
    if(isCompleted(p)){buckets.completed.push(p);return;}
    const info=dateInfo(p.date);
    buckets[info.bucket].push(p);
  });
  // sort each bucket by date asc
  Object.keys(buckets).forEach(k=>{
    buckets[k].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  });

  const completedTitle=(statuses[statuses.length-1]?.label)||'Опубликовано';
  const sections=[
    {key:'overdue',  title:'Просрочено',     cls:'overdue'},
    {key:'today',    title:'Сегодня',        cls:'today'},
    {key:'tomorrow', title:'Завтра',         cls:''},
    {key:'week',     title:'На этой неделе', cls:''},
    {key:'later',    title:'Позже',          cls:''},
    {key:'nodate',   title:'Без даты',       cls:''},
    {key:'completed',title:completedTitle,   cls:'completed'},
  ];

  const html=sections.filter(s=>buckets[s.key].length>0).map(s=>{
    const isCol=collapsed[s.key]?' collapsed':'';
    return `<div class="section${isCol}" id="sec-${s.key}">
      <div class="section-head" onclick="toggleSection('${s.key}')">
        <div class="section-title ${s.cls}">${s.title}</div>
        <div class="section-count">${buckets[s.key].length}</div>
        <div class="section-toggle">▾</div>
      </div>
      <div class="post-list">
        ${buckets[s.key].map(p=>renderPostRow(p,s.key)).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('sections').innerHTML=html||'<div class="empty-section">Нет постов в этой рубрике</div>';
}

let collapsed={completed:true};
function toggleSection(k){collapsed[k]=!collapsed[k];render();}

function renderPostRow(p,bucket){
  const c=getCat(p.cat),s=getStatus(p.status);
  const info=dateInfo(p.date);
  const dateCls=bucket==='overdue'?'overdue':(bucket==='today'?'today':'');
  const catBg=hexToRgba(c.color,0.15);
  return `<div class="post-row" onclick="openDrawer(${p.id})">
    <div class="status-dot" style="background:${s.color};box-shadow:inset 0 0 0 1px ${hexToRgba(s.color,0.4)};"
      onclick="event.stopPropagation();openStatusPopup(event,${p.id})" title="${esc(s.label)}"></div>
    <div class="post-body">
      <div class="post-topic">${esc(p.topic)}</div>
      <div class="post-sub">
        <span class="post-cat-tag" style="background:${catBg};color:${c.color}"><span class="cdot" style="background:${c.color}"></span>${esc(c.label)}</span>
        <span class="post-fmt">${esc(p.fmt||'')}</span>
      </div>
    </div>
    <div class="post-date ${dateCls}">${info.label}</div>
  </div>`;
}

/* ===== STATUS POPUP ===== */
function openStatusPopup(e,id){
  e.stopPropagation();
  const popup=document.getElementById('status-popup');
  popup.innerHTML=statuses.map(s=>`<div class="status-popup-item" onclick="setPostStatus(${id},'${s.id}')"><span class="sp-dot" style="background:${s.color}"></span>${esc(s.label)}</div>`).join('');
  const rect=e.currentTarget.getBoundingClientRect();
  popup.style.display='block';
  // position - try below first, if not enough room, above
  const top=rect.bottom+4;
  popup.style.top=(top+200>window.innerHeight?rect.top-200:top)+'px';
  popup.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-180))+'px';
}
function setPostStatus(id,sid){
  const p=posts.find(x=>x.id===id);
  if(p){snapshot();p.status=sid;save();render();if(currentPage==='cal')renderCal();}
  document.getElementById('status-popup').style.display='none';
}
document.addEventListener('click',function(e){
  const popup=document.getElementById('status-popup');
  if(popup.style.display!=='none'&&!popup.contains(e.target))popup.style.display='none';
});

/* ===== ADD POST MODAL ===== */
function openModal(dateStr){
  document.getElementById('f-cat').innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.label)}</option>`).join('');
  document.getElementById('f-date').value=dateStr||todayISO();
  document.getElementById('f-topic').value='';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-topic').focus(),50);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function addPost(){
  const date=document.getElementById('f-date').value;
  const cat=document.getElementById('f-cat').value;
  const topic=document.getElementById('f-topic').value.trim();
  const fmt=document.getElementById('f-fmt').value;
  if(!topic){document.getElementById('f-topic').focus();return;}
  snapshot();
  posts.push({id:nextId++,date,cat,topic,fmt,status:statuses[0]?.id||'idea',text:'',files:[]});
  save();closeModal();render();if(currentPage==='cal')renderCal();
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

/* ===== DASHBOARD ===== */
function renderDash(){
  const total=posts.length;
  const counts={};statuses.forEach(s=>counts[s.id]=0);
  posts.forEach(p=>{if(counts[p.status]!==undefined)counts[p.status]++;});

  // top stats — first 3 statuses + total
  const cards=[
    {label:'Всего постов',val:total},
    ...statuses.slice(0,3).map(s=>({label:s.label,val:counts[s.id]||0,color:s.color})),
  ];
  document.getElementById('dash-stats').innerHTML=cards.map(c=>
    `<div class="dash-card"><div class="dash-val"${c.color?` style="color:${c.color}"`:''}>${c.val}</div><div class="dash-label">${esc(c.label)}</div></div>`
  ).join('');

  // status breakdown
  const max=Math.max(1,...statuses.map(s=>counts[s.id]||0));
  document.getElementById('bd-status').innerHTML=statuses.map(s=>{
    const n=counts[s.id]||0;
    return `<div class="bd-row">
      <div class="bd-label"><span class="ldot" style="background:${s.color}"></span>${esc(s.label)}</div>
      <div class="bd-bar"><div class="bd-fill" style="width:${(n/max)*100}%;background:${s.color}"></div></div>
      <div class="bd-count">${n}</div>
    </div>`;
  }).join('');

  // category breakdown
  const catCounts={};cats.forEach(c=>catCounts[c.id]=0);
  posts.forEach(p=>{if(catCounts[p.cat]!==undefined)catCounts[p.cat]++;});
  const catMax=Math.max(1,...cats.map(c=>catCounts[c.id]||0));
  document.getElementById('bd-cat').innerHTML=cats.map(c=>{
    const n=catCounts[c.id]||0;
    return `<div class="bd-row">
      <div class="bd-label"><span class="ldot" style="background:${c.color}"></span>${esc(c.label)}</div>
      <div class="bd-bar"><div class="bd-fill" style="width:${(n/catMax)*100}%;background:${c.color}"></div></div>
      <div class="bd-count">${n}</div>
    </div>`;
  }).join('');
}

/* ===== SETTINGS ===== */
function renderSettings(){renderCatList();renderStatusList();}
function renderCatList(){document.getElementById('cat-list').innerHTML=cats.map(c=>`<span class="tag-item"><span class="tsw" style="background:${c.color}"></span>${esc(c.label)}<button class="tag-del" onclick="deleteCat('${c.id}')">×</button></span>`).join('');}
function renderStatusList(){document.getElementById('status-list').innerHTML=statuses.map(s=>`<span class="tag-item"><span class="tsw" style="background:${s.color}"></span>${esc(s.label)}<button class="tag-del" onclick="deleteStatus('${s.id}')">×</button></span>`).join('');}
function addCat(){const n=document.getElementById('new-cat-name').value.trim(),c=document.getElementById('new-cat-color').value;if(!n)return;cats.push({id:'cat_'+Date.now(),label:n,color:c});document.getElementById('new-cat-name').value='';renderCatList();save();}
function deleteCat(id){if(cats.length<=1){alert('Нужна хотя бы одна рубрика');return;}cats=cats.filter(c=>c.id!==id);renderCatList();save();render();}
function addStatus(){const n=document.getElementById('new-status-name').value.trim(),c=document.getElementById('new-status-color').value;if(!n)return;statuses.push({id:'st_'+Date.now(),label:n,color:c});document.getElementById('new-status-name').value='';renderStatusList();save();}
function deleteStatus(id){if(statuses.length<=1){alert('Нужен хотя бы один статус');return;}statuses=statuses.filter(s=>s.id!==id);renderStatusList();save();render();}

/* ===== CALENDAR ===== */
function moveMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCal();}
function goToday(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCal();}
function renderCal(){
  document.getElementById('cal-title').textContent=MONTHS_RU[calMonth]+' '+calYear;
  const grid=document.getElementById('cal-grid');
  const dows=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let h=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const offset=firstDay===0?6:firstDay-1;
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=todayISO();
  const prev=new Date(calYear,calMonth,0).getDate();
  for(let i=0;i<offset;i++)h+=`<div class="cal-day other-m"><div class="cal-day-num">${prev-offset+1+i}</div></div>`;
  for(let d=1;d<=dim;d++){
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dp=posts.filter(p=>p.date===iso);
    const shown=dp.slice(0,3),extra=dp.length-3;
    const ph=shown.map(p=>{const c=getCat(p.cat);return `<div class="cal-post" style="background:${hexToRgba(c.color,0.15)};color:${c.color}" draggable="true" data-id="${p.id}" ondragstart="calDragStart(event,${p.id})" ondragend="calDragEnd(event)" onclick="openDrawer(${p.id})" title="${esc(p.topic)}">${esc(p.topic)}</div>`;}).join('');
    const more=extra>0?`<div style="font-size:10px;color:var(--muted);cursor:pointer;" onclick="goPage('list')">+${extra} ещё</div>`:'';
    h+=`<div class="cal-day${iso===todayStr?' today-cell':''}" data-date="${iso}" ondragover="calDragOver(event)" ondragleave="calDragLeave(event)" ondrop="calDrop(event,'${iso}')"><div class="cal-day-num">${d}</div>${ph}${more}<button class="cal-add" onclick="openModal('${iso}')">+</button></div>`;
  }
  const rem=(offset+dim)%7;
  if(rem>0)for(let i=1;i<=7-rem;i++)h+=`<div class="cal-day other-m"><div class="cal-day-num">${i}</div></div>`;
  grid.innerHTML=h;
}
function calDragStart(e,id){calDragId=id;e.stopPropagation();e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));setTimeout(()=>{const el=document.querySelector(`.cal-post[data-id="${id}"]`);if(el)el.classList.add('dragging-cal');},0);}
function calDragEnd(){document.querySelectorAll('.cal-post.dragging-cal,.cal-day.drag-over').forEach(el=>el.classList.remove('dragging-cal','drag-over'));calDragId=null;}
function calDragOver(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over');}
function calDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function calDrop(e,dateStr){
  e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');
  const id=calDragId||parseInt(e.dataTransfer.getData('text/plain'));if(!id)return;
  const p=posts.find(x=>x.id===id);
  if(p&&p.date!==dateStr){snapshot();p.date=dateStr;save();renderCal();render();}
  calDragId=null;
}

/* ===== DRAWER ===== */
function openDrawer(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  drawerId=id;
  drawerFiles=(p.files||[]).map(f=>({...f}));
  const c=getCat(p.cat);
  document.getElementById('d-title').textContent=p.topic;
  const info=dateInfo(p.date);
  document.getElementById('d-meta').textContent=(info.label||'без даты')+' · '+c.label+' · '+p.fmt;
  document.getElementById('d-edit-topic').value=p.topic||'';
  document.getElementById('d-edit-date').value=p.date||'';
  document.getElementById('d-edit-cat').innerHTML=cats.map(cc=>`<option value="${cc.id}"${cc.id===p.cat?' selected':''}>${esc(cc.label)}</option>`).join('');
  document.getElementById('d-edit-fmt').value=p.fmt||'Рилс';
  document.getElementById('d-edit-status').innerHTML=statuses.map(s=>`<option value="${s.id}"${s.id===p.status?' selected':''}>${esc(s.label)}</option>`).join('');
  document.getElementById('d-text').value=p.text||'';
  document.getElementById('d-hint').textContent='';
  renderFiles();
  document.getElementById('drawer-bg').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer-bg').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  drawerId=null;drawerFiles=[];
}
function saveDrawer(){
  if(!drawerId)return;
  const p=posts.find(x=>x.id===drawerId);if(!p)return;
  snapshot();
  p.topic=document.getElementById('d-edit-topic').value.trim()||p.topic;
  p.date=document.getElementById('d-edit-date').value||p.date;
  p.cat=document.getElementById('d-edit-cat').value||p.cat;
  p.fmt=document.getElementById('d-edit-fmt').value||p.fmt;
  p.status=document.getElementById('d-edit-status').value||p.status;
  p.text=document.getElementById('d-text').value;
  p.files=drawerFiles.map(f=>({name:f.name,size:f.size,type:f.type,data:f.data||f.preview||null}));
  document.getElementById('d-title').textContent=p.topic;
  const info=dateInfo(p.date);
  document.getElementById('d-meta').textContent=(info.label||'без даты')+' · '+getCat(p.cat).label+' · '+p.fmt;
  save();render();if(currentPage==='cal')renderCal();
  document.getElementById('d-hint').textContent='Сохранено ✓';
  setTimeout(()=>{document.getElementById('d-hint').textContent='';},2000);
}
function deleteFromDrawer(){
  if(!drawerId)return;
  if(!confirm('Удалить пост?'))return;
  snapshot();
  posts=posts.filter(x=>x.id!==drawerId);
  save();closeDrawer();render();if(currentPage==='cal')renderCal();
}

/* ===== FILES ===== */
function renderFiles(){
  const el=document.getElementById('file-list');
  if(!drawerFiles.length){el.innerHTML='';return;}
  el.innerHTML=drawerFiles.map((f,i)=>{
    const src=f.data||f.preview||null;
    const isImg=f.type&&f.type.startsWith('image/');
    const thumb=src?(isImg?`<img src="${src}" alt="">`:'📄'):(f.type&&f.type.startsWith('video/')?'▶':'📄');
    return `<div class="file-item">
      <div class="f-thumb">${thumb}</div>
      <div class="f-info"><div class="f-name">${esc(f.name)}</div><div class="f-size">${fmtSize(f.size)}</div></div>
      <div class="f-actions">${src?`<button class="f-dl" onclick="downloadFile(${i})">⬇</button>`:''}<button class="f-del" onclick="removeFile(${i})">×</button></div>
    </div>`;
  }).join('');
}
function downloadFile(i){const f=drawerFiles[i];const src=f.data||f.preview;if(!src)return;const a=document.createElement('a');a.href=src;a.download=f.name;a.click();}
function removeFile(i){drawerFiles.splice(i,1);renderFiles();}
function fmtSize(b){if(!b)return '';if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB';}
function addFiles(files){Array.from(files).forEach(file=>{const e={name:file.name,size:file.size,type:file.type,data:null};drawerFiles.push(e);const r=new FileReader();r.onload=ev=>{e.data=ev.target.result;renderFiles();};r.readAsDataURL(file);});}
function onFileSelect(e){addFiles(e.target.files);e.target.value='';}
function onFileDragOver(e){e.preventDefault();document.getElementById('drop-zone').classList.add('over');}
function onFileDragLeave(){document.getElementById('drop-zone').classList.remove('over');}
function onFileDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('over');addFiles(e.dataTransfer.files);}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('drawer').classList.contains('open'))closeDrawer();
    else if(document.getElementById('modal').classList.contains('open'))closeModal();
  }
  const inInp=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&!inInp){
    if(e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
    if(e.key==='y'||(e.key==='z'&&e.shiftKey)){e.preventDefault();redo();}
  }
});

load().then(()=>{startPolling();keepAlive();});
</script>
